<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Mobile status bar tint -->
    <meta name="theme-color" content="#043A68" />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon/favicon-96x96.png"
      sizes="96x96"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/favicon/favicon.ico" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/favicon/site.webmanifest" />

    <!-- Preload visuals so first paint matches the app -->
    <link rel="preload" href="/GradientLines.svg" as="image" />
    <link rel="preload" href="/Rectangle.svg" as="image" />
    <link
      rel="preload"
      href="/logo/logo-care-standard.svg"
      as="image"
      fetchpriority="high"
    />

    <!-- Canonical -->
    <link rel="canonical" href="https://care-standard.vercel.app/" />

    <!-- Primary Meta -->
    <title>
      Care360 Standard | Compassionate Home & Community Care Across the UK
    </title>
    <meta
      name="description"
      content="Care360 Standard provides reliable, person-centred home and community care across the UK — from domiciliary support to complex care. Safe, compassionate, and CQC-focused."
    />
    <meta name="author" content="Care360 Standard" />
    <meta name="robots" content="index, follow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Care360 Standard" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://care-standard.vercel.app/" />
    <meta
      property="og:title"
      content="Care360 Standard | Compassionate Home & Community Care Across the UK"
    />
    <meta
      property="og:description"
      content="Person-centred, dignified support at home. Domiciliary, respite, live-in, and complex care tailored to you."
    />
    <meta
      property="og:image"
      content="https://care-standard.vercel.app/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Care360 Standard — professional carer supporting a client at home"
    />
    <meta property="og:site_name" content="Care360 Standard" />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Care360 Standard | Compassionate Home & Community Care Across the UK"
    />
    <meta
      name="twitter:description"
      content="Trusted UK care provider delivering safe, person-centred home and community support."
    />
    <meta
      name="twitter:image"
      content="https://care-standard.vercel.app/og-image.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Care360 Standard — professional carer supporting a client at home"
    />

    <!-- Structured Data: WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Care360 Standard",
        "url": "https://care-standard.vercel.app/",
        "inLanguage": "en-GB",
        "description": "Care360 Standard provides reliable, person-centred home and community care across the UK.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://care-standard.vercel.app/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Structured Data: Organisation (safe defaults; fill in real details when ready) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["Organization", "LocalBusiness"],
        "name": "Care360 Standard",
        "url": "https://care-standard.vercel.app/",
        "logo": "https://care-standard.vercel.app/logo/logo-care-standard.svg",
        "image": "https://care-standard.vercel.app/og-image.jpg",
        "telephone": "+44",
        "email": "info@care360standard.co.uk",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "GB"
        },
        "areaServed": "GB",
        "sameAs": []
      }
    </script>
  </head>

  <body>
    <!-- Paints instantly on first byte -->
    <div
      id="boot-bg"
      aria-hidden="true"
      style="
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        background: linear-gradient(180deg, #02794d 0%, #043a68 100%);
      "
    >
      <div
        style="
          position: absolute;
          inset: 0;
          pointer-events: none;
          opacity: 0.6;
          mix-blend-mode: overlay;
          background-image: url('/GradientLines.svg'), url('/Rectangle.svg');
          background-repeat: no-repeat, no-repeat;
          background-size: cover, cover;
          background-position: center, center;
        "
      ></div>
      <div
        style="position: absolute; inset: 0; display: grid; place-items: center"
      >
        <img
          src="/logo/logo-care-standard.svg"
          alt="Care360 Standard logo"
          style="
            width: 250px;
            height: auto;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
          "
        />
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
